name: Consilium V2 time and evidence gate
on:
  pull_request:
    paths:
      - "DISCUSSIONS/**"
      - "consilium/**"
      - ".github/workflows/consilium-gate.yml"
  workflow_dispatch:
jobs:
  consilium-time-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verifier
        run: python -m pip install cryptography
      - name: Run negative and happy-path structural tests
        run: python -m unittest discover -s tests -p 'test_consilium_gate.py' -v
      - name: Require trusted 54-session evidence (fail closed)
        run: |
          python -m consilium.verify_sessions \
            --source FBS_FULL_54/FBS_ALL_54_SOURCE_AND_DECISION.csv \
            --sessions consilium/session_registry.json \
            --trusted-pubkey consilium/trusted_orchestrator_ed25519.pub
